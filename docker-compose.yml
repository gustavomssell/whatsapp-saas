services:
  evolution-api:
    image: atendai/evolution-api:latest
    container_name: wpsaas_evolution
    restart: unless-stopped
    ports:
      - "8082:8080"
    environment:
      - GLOBAL_API_KEY=${EVOLUTION_API_KEY:-wpsaas-evolution-key}
      - DATABASE_URL=postgres://postgres:postgres@postgres:5432/evolution?sslmode=disable
      - REDIS_URL=redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - wpsaas

  redis:
    image: redis:7-alpine
    container_name: wpsaas_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - wpsaas

  postgres:
    image: postgres:16-alpine
    container_name: wpsaas_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: wpsaas
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5435:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d wpsaas"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - wpsaas

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: wpsaas_api
    restart: unless-stopped
    ports:
      - "8090:8080"
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/wpsaas?sslmode=disable
      JWT_SECRET: wpsaas-secret-change-in-production
      PORT: 8080
      ENV: development
      UPLOAD_DIR: /app/uploads
      UPLOAD_MAX_SIZE_MB: 32
      UPLOAD_PUBLIC_URL: http://localhost:8090/uploads
      EVOLUTION_API_URL: http://evolution-api:8080
      EVOLUTION_API_KEY: ${EVOLUTION_API_KEY:-}
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - wpsaas

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: wpsaas_web
    restart: unless-stopped
    ports:
      - "3080:80"
    depends_on:
      - backend
    networks:
      - wpsaas

volumes:
  postgres_data:
    name: wpsaas_postgres_data
  uploads_data:

networks:
  wpsaas:
    driver: bridge
