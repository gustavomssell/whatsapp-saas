name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - name: Download dependencies
        run: go mod download
        working-directory: ./backend

      - name: Vet
        run: go vet ./...
        working-directory: ./backend

      - name: Test
        run: go test ./internal/config/ ./internal/handler/ ./internal/middleware/ ./internal/socket/ -count=1 -timeout 30s
        working-directory: ./backend

      - name: Build
        run: go build -o /dev/null ./cmd/api
        working-directory: ./backend

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps
        working-directory: ./frontend

      - name: TypeScript check
        run: npx tsc --noEmit
        working-directory: ./frontend

      - name: Lint
        run: npm run lint
        working-directory: ./frontend

      - name: Test
        run: npm run test
        working-directory: ./frontend

      - name: Build
        run: npm run build
        working-directory: ./frontend

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Build backend
        run: docker compose build backend

      - name: Build frontend
        run: docker compose build frontend
